<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRSI Standee Calculator</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #153b5b;
      --blue: #246b9b;
      --blue-light: #e9f4fb;
      --ink: #172b3a;
      --muted: #627687;
      --line: #d8e3eb;
      --surface: #ffffff;
      --page: #eef3f7;
      --danger: #b93c48;
      --shadow: 0 24px 70px rgba(28, 55, 75, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(82, 159, 205, 0.13), transparent 30%),
        linear-gradient(145deg, #f5f8fb, var(--page));
      font-family: "Segoe UI", Arial, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .login-container,
    .container {
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(216, 227, 235, 0.9);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .login-container {
      max-width: 460px;
      margin-top: 6vh;
      padding: 38px;
    }

    .login-container h2 {
      margin: 0 0 28px;
      color: var(--navy);
      font-size: 25px;
      line-height: 1.25;
      text-align: center;
    }

    .container {
      max-width: 1040px;
    }

    .header {
      position: relative;
      padding: 30px 190px;
      color: #fff;
      background: linear-gradient(120deg, #153b5b, #246b9b);
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 34px);
      letter-spacing: -0.5px;
    }

    .header p {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 15px;
    }

    .content {
      padding: clamp(24px, 5vw, 48px);
    }

    #uploadPage {
      max-width: 560px;
      margin: 12px auto 18px;
    }

    .field {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 9px;
    }

    label {
      color: var(--ink);
      font-size: 15px;
      font-weight: 650;
    }

    input,
    select {
      width: 100%;
      min-height: 48px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: #fbfdff;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(36, 107, 155, 0.12);
    }

    input[type="file"] {
      padding: 8px;
      color: var(--muted);
      background: #f8fbfd;
    }

    input[type="file"]::file-selector-button {
      margin-right: 12px;
      padding: 9px 13px;
      border: 0;
      border-radius: 7px;
      color: var(--navy);
      background: #e4f0f7;
      cursor: pointer;
      font-weight: 600;
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    #calculatorPage {
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    button {
      min-height: 46px;
      padding: 11px 19px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: transform 150ms ease, filter 150ms ease, box-shadow 150ms ease;
    }

    button:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid rgba(36, 107, 155, 0.3);
      outline-offset: 3px;
    }

    .calc-btn {
      color: #fff;
      background: var(--blue);
      box-shadow: 0 6px 14px rgba(36, 107, 155, 0.18);
    }

    .clear-btn,
    .back-btn {
      color: var(--navy);
      background: #eaf0f4;
    }

    .logout-btn {
      color: #fff;
      background: var(--danger);
    }

    .header-logout {
      position: absolute;
      top: 50%;
      right: 28px;
      transform: translateY(-50%);
    }

    .header-logout:hover {
      transform: translateY(calc(-50% - 1px));
    }

    .result {
      display: none;
      margin-top: 30px;
      padding: 24px;
      border: 1px solid #d4e8f4;
      border-radius: 14px;
      background: linear-gradient(135deg, #f2f9fd, #eaf4fa);
    }

    .result h3 {
      margin: 0 0 16px;
      color: var(--navy);
      font-size: 19px;
    }

    .highlight {
      color: var(--blue);
      font-size: 19px;
      font-weight: 750;
    }

    .client-title {
      margin: 0 0 28px;
      color: var(--navy);
      font-size: 21px;
    }

    .note {
      margin-top: 24px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: #f8fafc;
      font-size: 14px;
      line-height: 1.8;
    }

    .note b {
      color: var(--ink);
    }

    .error {
      margin-top: 12px;
      color: var(--danger);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      body {
        padding: 20px 12px;
      }

      .login-container {
        margin-top: 4vh;
        padding: 28px 22px;
      }

      .header {
        padding: 25px 18px 20px;
      }

      .header-logout {
        position: static;
        margin-top: 16px;
        transform: none;
      }

      .header-logout:hover {
        transform: translateY(-1px);
      }

      .content {
        padding: 24px 18px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .buttons button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>CRSI Standee Calculator</h1>
      <p>Standees Between Mats of Steel</p>
    </header>

    <main class="content">
      <!-- Upload page -->
      <section id="uploadPage">
        <div class="field">
          <label for="jsonFile">Upload Client Rule JSON</label>
          <input type="file" id="jsonFile" accept=".json">
          <small id="jsonStatus" class="status">No JSON Loaded</small>
        </div>
        <br>
        <button class="calc-btn" onclick="loadCalculator()">Submit</button>
      </section>

      <!-- Calculator page -->
      <section id="calculatorPage">
        <button class="back-btn" onclick="goBack()">&larr; Back</button>
        <h2 id="clientTitle" class="client-title"></h2>

        <div class="grid">
          <div class="field">
            <label for="depth">Concrete Depth (in)</label>
            <input type="number" id="depth" step="0.01">
          </div>
          <div class="field">
            <label for="topCover">Top Cover (in)</label>
            <input type="number" id="topCover" step="0.01">
          </div>
          <div class="field">
            <label for="bottomCover">Bottom Cover (in)</label>
            <input type="number" id="bottomCover" step="0.01">
          </div>
          <div class="field">
            <label for="topBar">Top Bar Size</label>
            <select id="topBar">
              <option>#3</option>
              <option>#4</option>
              <option>#5</option>
              <option>#6</option>
              <option>#7</option>
              <option>#8</option>
              <option>#9</option>
              <option>#10</option>
              <option>#11</option>
              <option>#14</option>
              <option>#18</option>
            </select>
          </div>
          <div class="field">
            <label for="bottomBar">Bottom Bar Size</label>
            <select id="bottomBar">
              <option>#3</option>
              <option>#4</option>
              <option>#5</option>
              <option>#6</option>
              <option>#7</option>
              <option>#8</option>
              <option>#9</option>
              <option>#10</option>
              <option>#11</option>
              <option>#14</option>
              <option>#18</option>
            </select>
          </div>
        </div>

        <div class="buttons">
          <button class="calc-btn" onclick="calculate()">Calculate</button>
          <button class="clear-btn" onclick="clearInputs()">Clear</button>
        </div>

        <div class="result" id="result">
          <h3>Result</h3>
          <p>
            <b>Height of Support:</b>
            <span id="supportHeight" class="highlight"></span>
          </p>
          <br>
          <p><b>Required Support:</b></p>
          <p id="supportType" class="highlight"></p>
          <br>
          <p id="calcBreakdown"></p>
        </div>

        <div class="note">
          <b>Notes:</b><br>
          &bull; Rules are loaded from uploaded JSON file.<br>
          &bull; Larger bar size governs support selection.<br>
          &bull; All support schedules are controlled through JSON.
        </div>
      </section>
    </main>
  </div>

  <script>
    const barDia = {
      "#3": 0.375,
      "#4": 0.500,
      "#5": 0.625,
      "#6": 0.750,
      "#7": 0.875,
      "#8": 1.000,
      "#9": 1.128,
      "#10": 1.270,
      "#11": 1.410,
      "#14": 1.693,
      "#18": 2.257
    };

    const barRank = {
      "#3": 3,
      "#4": 4,
      "#5": 5,
      "#6": 6,
      "#7": 7,
      "#8": 8,
      "#9": 9,
      "#10": 10,
      "#11": 11,
      "#14": 14,
      "#18": 18
    };

    let clientRules = null;

    /* JSON upload */
    document.getElementById("jsonFile").addEventListener("change", function (event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          clientRules = JSON.parse(e.target.result);
          document.getElementById("jsonStatus").innerText = "Loaded: " + clientRules.clientName;
          document.getElementById("jsonStatus").style.color = "green";
        } catch (error) {
          document.getElementById("jsonStatus").innerText = "Invalid JSON";
          document.getElementById("jsonStatus").style.color = "red";
          clientRules = null;
        }
      };
      reader.readAsText(file);
    });

    /* Navigation */
    function loadCalculator() {
      if (!clientRules) {
        alert("Please upload a valid JSON file first.");
        return;
      }

      document.getElementById("uploadPage").style.display = "none";
      document.getElementById("calculatorPage").style.display = "block";
      document.getElementById("clientTitle").innerText = "Client: " + clientRules.clientName;
    }

    function goBack() {
      document.getElementById("calculatorPage").style.display = "none";
      document.getElementById("uploadPage").style.display = "block";
    }

    /* Rule reader */
    function getSupport(height, maxBar) {
      if (!clientRules) return "Upload JSON File";

      for (const rule of clientRules.rules) {
        if (height >= rule.minHeight && height <= rule.maxHeight) {
          for (const barRule of rule.barGroups) {
            if (maxBar >= barRule.minBar && maxBar <= barRule.maxBar) {
              return barRule.support;
            }
          }
        }
      }

      return clientRules.defaultMessage || "No matching rule found";
    }

    /* Calculate */
    function calculate() {
      const depth = parseFloat(document.getElementById("depth").value);
      const topCover = parseFloat(document.getElementById("topCover").value);
      const bottomCover = parseFloat(document.getElementById("bottomCover").value);
      const topBar = document.getElementById("topBar").value;
      const bottomBar = document.getElementById("bottomBar").value;

      if (isNaN(depth) || isNaN(topCover) || isNaN(bottomCover)) {
        alert("Please enter all values.");
        return;
      }

      const topDia = barDia[topBar];
      const bottomDia = barDia[bottomBar];
      let supportHeight = depth - topCover - bottomCover - (2 * topDia) - (2 * bottomDia);
      supportHeight = Number(supportHeight.toFixed(2));

      const maxBar = Math.max(barRank[topBar], barRank[bottomBar]);
      const support = getSupport(supportHeight, maxBar);

      document.getElementById("supportHeight").innerText = supportHeight + '"';
      document.getElementById("supportType").innerText = support;
      document.getElementById("calcBreakdown").innerHTML =
        "<b>Calculation:</b><br>" +
        depth + " - " + topCover + " - " + bottomCover +
        " - (2 × " + topDia + ") - (2 × " + bottomDia +
        ") = <b>" + supportHeight + '"</b>';
      document.getElementById("result").style.display = "block";
    }

    /* Clear */
    function clearInputs() {
      document.getElementById("depth").value = "";
      document.getElementById("topCover").value = "";
      document.getElementById("bottomCover").value = "";
      document.getElementById("topBar").selectedIndex = 0;
      document.getElementById("bottomBar").selectedIndex = 0;
      document.getElementById("result").style.display = "none";
    }
  </script>
</body>
</html>
